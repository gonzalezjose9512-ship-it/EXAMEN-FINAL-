# =============================================================================
# TiendaNorte - entorno completo con un solo comando:
#     docker compose up -d
#
# Por ahora levanta PostgreSQL 16 (Hito 4) y RabbitMQ 3.13 (Hito 6).
# En las próximas etapas se suman pedidos-api, inventario, pagos y logistica.
# =============================================================================
name: tiendanorte

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tiendanorte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      # 5433 en tu PC → 5432 dentro del contenedor.
      # Se usa 5433 para no chocar con un PostgreSQL instalado localmente en el 5432.
      - "5433:5432"
    volumes:
      # Datos persistentes: sobreviven a "docker compose down" (se borran con "down -v")
      - pgdata:/var/lib/postgresql/data
      # Scripts que crean esquemas, roles, tablas y datos iniciales.
      # PostgreSQL los ejecuta en orden alfabético SOLO la primera vez (volumen vacío).
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Los demás servicios esperan a que la base acepte conexiones
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiendanorte"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    # Nombre fijo: RabbitMQ guarda sus datos según el nombre del nodo (rabbit@rabbitmq).
    # Sin esto, al recrear el contenedor se perderían las colas durables.
    hostname: rabbitmq
    environment:
      # El usuario "guest" solo puede conectarse desde el mismo contenedor,
      # por eso se crea un usuario propio para los servicios.
      RABBITMQ_DEFAULT_USER: tiendanorte
      RABBITMQ_DEFAULT_PASS: tiendanorte_dev
    ports:
      - "5672:5672"     # AMQP: lo usan la API y los servicios
      - "15672:15672"   # Panel de administración: http://localhost:15672
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  pgdata:
  rabbitmqdata:
